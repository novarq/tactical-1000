#
# Bus Blaster v4.1a - Interface Configuration
# Using default JTAGkey-compatible CPLD buffer
#
# Reference: http://dangerousprototypes.com/docs/Bus_Blaster_v4_design_overview
#

adapter driver ftdi
ftdi device_desc "Dual RS232-HS"
ftdi vid_pid 0x0403 0x6010

# JTAGkey-compatible buffer layout
ftdi layout_init 0x0c08 0x0f1b
ftdi layout_signal nTRST -data 0x0100 -noe 0x0400
ftdi layout_signal nSRST -data 0x0200 -noe 0x0800

# Start with a conservative clock speed for initial bringup
# Can be increased once connection is verified
adapter speed 1000

transport select jtag
